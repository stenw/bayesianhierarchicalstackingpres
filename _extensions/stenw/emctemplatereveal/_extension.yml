title: Erasmus MC Reveal.js presentation
version: 2.4.0
quarto-required: ">=1.5.0"
contributes:
  shortcodes:
    - emc-color.lua
  formats:
    revealjs:
      template-partials:
        - title-slide.html
      # Reveal resolves this URL from the rendered HTML, not from this file.
      title-slide-attributes:
        data-background-image: _extensions/stenw/emctemplatereveal/layoutassets/eebuildingdbluescreensize.jpg
      width: 1280
      height: 720
      margin: 0.05
      # Show the current slide number only; use c/t to add the total.
      slide-number: c
      callout-appearance: simple
      filters:
        - color-text.lua
        - bg-style.lua
        - emc-layout.lua
      css:
        - emc-slides.css
      theme: [default, emctemplatereveal.scss]
      menu:
        side: left
        slide-number: true
